[workspace]
members = [
  "apps/agent",
  "apps/master",
  "crates/application",
  "crates/api",
  "crates/config",
  "crates/domain",
  "crates/identity",
  "crates/object-store",
  "crates/persistence",
  "crates/secrets",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", features = ["std"] }
async-trait = "=0.1.92"
axum = "=0.8.9"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
password-hash = { version = "=0.5.0", default-features = false }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros", "uuid"] }
subtle = "=2.6.1"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "serde"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["request-id", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "=5.5.0", features = ["uuid"] }
uuid = { version = "=1.25.0", features = ["serde", "v7"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
